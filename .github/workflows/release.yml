# Release builds. SignPath (and anyone else) can only trust binaries produced by a
# verifiable automated build, so official releases come from this workflow, not from a
# local scripts/build-dist.sh run. The workflow calls that same script, so the output
# layout, included files, and archive naming are identical to a local build.
#
# Trigger: push a tag like v0.1.0 (or run manually via workflow_dispatch, which builds
# and uploads workflow artifacts but does not create a GitHub Release).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # gh release create

env:
  # OnePageRules rules-set version stamped into archive names (FdgRaylib-win-x64-<this>.zip).
  # Must match what scripts/build-dist.sh expects; bump here when the implemented ruleset revs.
  RULES_VERSION: OPR_3_5_1

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with rules-engine submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build all platform archives (win-x64, linux-x64, osx-arm64, osx-x64)
        run: scripts/build-dist.sh

      # The unpacked Windows folder is uploaded BEFORE release assembly: SignPath signs
      # this workflow artifact and hands it back, and the release zip is then rebuilt
      # from the signed result (see the disabled steps below).
      - name: Upload unsigned Windows build as workflow artifact
        id: upload-unsigned-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FdgRaylib-win-x64-unsigned
          path: dist/FdgRaylib-win-x64/
          if-no-files-found: error

      # -------------------------------------------------------------------------------
      # SignPath code signing - DISABLED until SignPath Foundation accepts the project.
      # To enable: add the SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG, and SIGNPATH_POLICY_SLUG repository secrets, then
      # uncomment BOTH steps below.
      # -------------------------------------------------------------------------------
      # - name: Submit SignPath signing request (Windows)
      #   id: signpath
      #   uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      #     signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
      #     github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist/signed/FdgRaylib-win-x64
      #
      # - name: Repackage Windows zip from the signed artifact
      #   run: |
      #     rm -rf dist/FdgRaylib-win-x64 "dist/FdgRaylib-win-x64-$RULES_VERSION.zip"
      #     mv dist/signed/FdgRaylib-win-x64 dist/FdgRaylib-win-x64
      #     ( cd dist && zip -rq "FdgRaylib-win-x64-$RULES_VERSION.zip" "FdgRaylib-win-x64" )

      - name: Generate SHA256SUMS.txt
        run: cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Future of Dark Grimness $GITHUB_REF_NAME" \
            --generate-notes

      # workflow_dispatch runs have no tag/release; keep the output retrievable.
      - name: Upload all archives as workflow artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
