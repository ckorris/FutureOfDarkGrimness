# Release builds. Official releases come from this workflow, not from a local
# scripts/build-dist.sh run, so every published binary traces back to a verifiable
# automated build. The workflow calls that same script, so the output
# layout, included files, and archive naming are identical to a local build.
#
# Trigger: push a tag like v0.1.0 (or run manually via workflow_dispatch, which builds
# and uploads workflow artifacts but does not create a GitHub Release).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # gh release create

env:
  # OnePageRules rules-set version. Rides in archive names alongside the app version
  # (FdgRaylib-win-x64-v<app>-<this>.zip) and in the release title. Must match what
  # scripts/build-dist.sh defaults to; bump here when the implemented ruleset revs.
  RULES_VERSION: OPR_3_5_1

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with rules-engine submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Guard: a tag vX.Y.Z must match Directory.Build.props <Version>, so a mistagged build
      # fails loudly instead of shipping archives/metadata that disagree with the tag.
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PROPS_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag $GITHUB_REF_NAME -> version $TAG_VERSION; Directory.Build.props -> $PROPS_VERSION"
          if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Directory.Build.props <Version>$PROPS_VERSION</Version>. Bump the prop or retag."
            exit 1
          fi

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build all platform archives (win-x64, linux-x64, osx-arm64, osx-x64)
        run: scripts/build-dist.sh

      - name: Generate SHA256SUMS.txt
        run: cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Human-readable rules version for the title: OPR_3_5_1 -> "OPR 3.5.1".
          RULES_DISPLAY="$(echo "$RULES_VERSION" | sed 's/^OPR_/OPR /; s/_/./g')"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Future of Dark Grimness $GITHUB_REF_NAME ($RULES_DISPLAY)" \
            --generate-notes

      # workflow_dispatch runs have no tag/release; keep the output retrievable.
      - name: Upload all archives as workflow artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
