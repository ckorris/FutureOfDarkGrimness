[project]
name = "fdglab-c"
version = "0.1.0"
description = "Tactician phase C: dataset loading and value-net training (#191 campaign steps 12-13)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
torch = ["torch>=2.3", "onnx>=1.16", "onnxruntime>=1.18"]

[tool.uv]
package = false
